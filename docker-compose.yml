# RenderFlow - full local stack.
#
#   pnpm db:migrate                                     # before first boot
#   docker compose up --build                           # apps + infra
#   docker compose up -d postgres redis minio mailhog   # infra only
#   docker compose --profile observability up -d        # + prometheus/grafana
#
# Compose reads the root `.env` for interpolation, so JWT and token-encryption
# secrets stay out of this file. The application containers talk to services by
# name (postgres, redis, minio); only the API and web ports are published.
#
# Every third-party image is pinned to a digest as well as a tag (SEC-08). A tag
# is a mutable pointer: if `prom/prometheus:latest` were re-pointed at a poisoned
# image, the next `pull` would run it with access to this stack's config and
# network. Dependabot opens a reviewed PR when a pinned digest ages.

name: renderflow

# Shared by every Node app container. The API and workers read the same
# configuration in development, so a value changed for one cannot silently
# diverge from the other.
x-app-environment: &app-environment
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://renderflow:renderflow@postgres:5432/renderflow
  REDIS_URL: redis://redis:6379
  CORS_ORIGINS: http://localhost:3000
  WEB_BASE_URL: http://localhost:3000
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 7d
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
  SIGNUP_BONUS_CREDITS: ${SIGNUP_BONUS_CREDITS:-50}
  # The browser journey signs up several users from one address; production
  # limits stay in .env.example.
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
  RATE_LIMIT_LOGIN_IP: ${RATE_LIMIT_LOGIN_IP:-1000/15m}
  RATE_LIMIT_LOGIN_ACCOUNT: ${RATE_LIMIT_LOGIN_ACCOUNT:-1000/1h}
  RATE_LIMIT_REGISTER_IP: ${RATE_LIMIT_REGISTER_IP:-1000/1h}
  RATE_LIMIT_REFRESH_IP: ${RATE_LIMIT_REFRESH_IP:-1000/15m}
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: renderflow-assets
  S3_ACCESS_KEY: minio
  S3_SECRET_KEY: minio12345
  S3_FORCE_PATH_STYLE: 'true'
  AI_PROVIDER: mock
  IMAGE_PROVIDER: mock
  TTS_PROVIDER: mock
  SOCIAL_PROVIDER: mock
  # Deterministic latency, so the browser journey can observe live progress on a
  # fast runner. Zero keeps ordinary local runs instant.
  MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-0}
  SMTP_URL: smtp://mailhog:1025
  # Compose runs a MailHog container, so the default here is the transport that
  # actually delivers somewhere a developer can inspect. A `.env` that sets
  # EMAIL_PROVIDER explicitly (for example `log`) still wins.
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailhog}
  EMAIL_FROM: ${EMAIL_FROM:-RenderFlow <no-reply@renderflow.local>}
  MAILHOG_SMTP_HOST: mailhog
  MAILHOG_SMTP_PORT: '1025'
  QUEUE_PREFIX: ${QUEUE_PREFIX:-renderflow}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
  PUBLISH_POLL_MS: ${PUBLISH_POLL_MS:-1000}
  REAPER_INTERVAL_SECONDS: ${REAPER_INTERVAL_SECONDS:-60}
  ANALYTICS_POLL_MS: ${ANALYTICS_POLL_MS:-60000}
  METRICS_COLLECTOR_ENABLED: ${METRICS_COLLECTOR_ENABLED:-true}
  METRICS_INTERVAL_MS: ${METRICS_INTERVAL_MS:-15000}
  BULL_BOARD_ENABLED: 'false'

x-node-build: &node-build
  context: .
  dockerfile: infra/docker/node-app.Dockerfile

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

services:
  postgres:
    # pgvector image: brand_memory.embedding is a `vector` column (Phase 6).
    image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    restart: unless-stopped
    environment:
      POSTGRES_USER: renderflow
      POSTGRES_PASSWORD: renderflow
      POSTGRES_DB: renderflow
      # Speeds up initdb; the app sets its own per-connection settings.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renderflow -d renderflow']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    # MinIO removed its community images from Docker Hub and Quay in September
    # 2026. pgsty publishes the maintained fork from the same source tree; pinned
    # tags keep a CI pull reproducible.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # console
    volumes:
      - miniodata:/data
    # No healthcheck: the server image is distroless and ships neither curl nor
    # mc. minio-init retries the alias instead, which is the dependency that
    # actually matters.

  minio-init:
    # One-shot bucket bootstrap: `depends_on: service_completed_successfully`
    # guarantees the bucket exists before the API or a worker boots.
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set renderflow http://minio:9000 minio minio12345; do
        echo 'waiting for minio'; sleep 1;
      done &&
      mc mb --ignore-existing renderflow/renderflow-assets &&
      echo 'bucket renderflow-assets ready'
      "
    restart: 'no'

  mailhog:
    image: mailhog/mailhog:latest@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

  # ---- application ------------------------------------------------------
  #
  # All Node services are built from the same multi-stage Dockerfile; the
  # workspace package name selects which dist and dependency graph to deploy.

  api:
    build:
      <<: *node-build
      args:
        APP_DIR: apps/api
        APP_NAME: '@renderflow/api'
    restart: unless-stopped
    environment: *app-environment
    ports:
      - '4000:4000'
    depends_on: *app-dependencies
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4000/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  content-worker:
    build:
      <<: *node-build
      args:
        APP_DIR: apps/content-worker
        APP_NAME: '@renderflow/content-worker'
    restart: unless-stopped
    environment: *app-environment
    depends_on: *app-dependencies

  media-worker:
    build:
      <<: *node-build
      args:
        APP_DIR: apps/media-worker
        APP_NAME: '@renderflow/media-worker'
    restart: unless-stopped
    environment: *app-environment
    depends_on: *app-dependencies

  publisher-worker:
    build:
      <<: *node-build
      args:
        APP_DIR: apps/publisher-worker
        APP_NAME: '@renderflow/publisher-worker'
    restart: unless-stopped
    environment: *app-environment
    depends_on: *app-dependencies

  analytics-worker:
    build:
      <<: *node-build
      args:
        APP_DIR: apps/analytics-worker
        APP_NAME: '@renderflow/analytics-worker'
    restart: unless-stopped
    environment: *app-environment
    depends_on: *app-dependencies

  outbox-relay:
    build:
      <<: *node-build
      args:
        APP_DIR: apps/outbox-relay
        APP_NAME: '@renderflow/outbox-relay'
    restart: unless-stopped
    environment: *app-environment
    depends_on: *app-dependencies

  reaper:
    build:
      <<: *node-build
      args:
        APP_DIR: apps/reaper
        APP_NAME: '@renderflow/reaper'
    restart: unless-stopped
    environment: *app-environment
    depends_on: *app-dependencies

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # The browser talks to localhost:4000; the web server itself must reach the
      # API by service name, or the pricing page's server-side fetch would call
      # its own container.
      API_INTERNAL_URL: http://api:4000/api/v1
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@renderflow.example}
    depends_on:
      api:
        condition: service_healthy

  alertmanager:
    # Receives firing alerts from Prometheus and delivers them to Slack. Kept in
    # the observability profile so `docker compose up` stays the lightweight app
    # stack; `--profile observability` brings the whole monitoring path up.
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    profiles: ['observability']
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      # Expands ${SLACK_WEBHOOK_URL} from the environment. Without this flag the
      # placeholder is sent literally and every notification fails.
      - '--config.expand-env'
    environment:
      # Compose supplies a valid placeholder when the operator has not set a
      # webhook yet. Alertmanager still starts and shows alerts on :9093.
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-https://hooks.slack.com/services/REPLACE/REPLACE/REPLACE}
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    ports:
      - '9093:9093'

  prometheus:
    image: prom/prometheus:latest@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: ['observability']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=6h'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The alert rules the Phase 9 DoD asks for. Mounted separately because
      # prometheus only reads rule_files at startup, so editing them without a
      # restart does nothing.
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      - redis
      - alertmanager

  grafana:
    image: grafana/grafana:latest@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: ['observability']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      # Provisioned dashboards, so a dashboard is reviewable in git rather than
      # being a thing someone exported once and forgot.
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  miniodata:
  grafanadata:
  alertmanagerdata:
