# RenderFlow - Phase 0 infrastructure stack.
#
#   docker compose up -d postgres redis minio mailhog     # infra only
#   docker compose --profile observability up -d          # + prometheus/grafana
#
# Application services are added in later phases (see PROJECT.md section 12).

name: renderflow

services:
  postgres:
    # pgvector image: brand_memory.embedding is a `vector` column (Phase 6).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: renderflow
      POSTGRES_PASSWORD: renderflow
      POSTGRES_DB: renderflow
      # Speeds up initdb; the app sets its own per-connection settings.
      POSTGRES_INITDB_ARGS: '--data-checksums'
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renderflow -d renderflow']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    # One-shot bucket bootstrap: `depends_on: service_completed_successfully`
    # guarantees the bucket exists before the API or a worker boots.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set renderflow http://minio:9000 minio minio12345 &&
      mc mb --ignore-existing renderflow/renderflow-assets &&
      echo 'bucket renderflow-assets ready'
      "
    restart: 'no'

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI

  prometheus:
    image: prom/prometheus:latest
    profiles: ['observability']
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=6h'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      - redis

  grafana:
    image: grafana/grafana:latest
    profiles: ['observability']
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  miniodata:
  grafanadata:
