          property: connectionString

  - type: worker
    name: renderflow-outbox-relay
    runtime: node
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @renderflow/outbox-relay start
    envVars:
