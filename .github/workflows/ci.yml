name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://renderflow:renderflow@localhost:5432/renderflow
  REDIS_URL: redis://localhost:6379
  # Mocks everywhere: CI must never call a real AI or social API.
  AI_PROVIDER: mock
  IMAGE_PROVIDER: mock
  TTS_PROVIDER: mock
  SOCIAL_PROVIDER: mock

jobs:
  lint-typecheck-test:
    name: lint, typecheck, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # eslint resolves @renderflow/* through their published `dist` types.
      # A fresh checkout has no dist, so lint would report every workspace
      # import as an error type. Build the packages first; typecheck and unit
      # tests reuse these artifacts from the Turbo cache.
      - name: build workspace packages
        run: pnpm build

      - name: lint
        run: pnpm lint

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests with coverage gate
        run: pnpm test:coverage

      - name: prettier check
        run: pnpm format:check

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      # High and critical only. The two remaining moderate advisories are in
      # dev-only tooling with no patched release (esbuild via drizzle-kit and
      # uuid via testcontainers); they are recorded in PROJECT.md. A high or
      # critical advisory anywhere fails the build, including one that arrives
      # through a transitive dependency.
      - name: audit for high and critical advisories
        run: pnpm audit --audit-level high

  integration:
    name: integration (real Postgres)
    runs-on: ubuntu-latest

    # A real Postgres service, not a mocked one: the credit guarantees this suite
    # checks (CHECK constraints, partial unique indexes, transaction rollback)
    # are enforced by the database itself.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: renderflow
          POSTGRES_PASSWORD: renderflow
          POSTGRES_DB: renderflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renderflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

      # The suites boot BullMQ queues. They do not need Redis to assert most
      # behaviour, but a missing connection produces reconnect noise and can
      # turn a real assertion failure into an unreadable log.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The ffmpeg suite renders a real mp4 and is skipped when the binary is
      # absent. Skipping it in CI silently lowered branch coverage below the
      # gate, so install it rather than accepting a partial suite.
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: integration tests with coverage gate
        env:
          TEST_DATABASE_URL: postgresql://renderflow:renderflow@localhost:5432/renderflow_test
        run: pnpm test:int:coverage

      # The drill restores into a second database and compares every table. It
      # runs after the suite so the source is the schema and data the tests just
      # produced, not an empty database.
      - name: install postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: backup and restore drill
        env:
          DATABASE_URL: postgresql://renderflow:renderflow@localhost:5432/renderflow_test
          RESTORE_DATABASE_URL: postgresql://renderflow:renderflow@localhost:5432/renderflow_restore
        run: |
          psql postgresql://renderflow:renderflow@localhost:5432/postgres \
            -v ON_ERROR_STOP=1 \
            -c 'create database renderflow_restore'
          pnpm backup:check

  chaos:
    name: chaos (real SIGKILL)
    runs-on: ubuntu-latest

    # R5 spawned a real worker and killed it. It needs a real Postgres (leases,
    # checkpoints, guarded updates) but not Redis: the queue message is read from
    # the outbox, so the test measures process death and lease expiry rather than
    # whether a broker happened to be up.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: renderflow
          POSTGRES_PASSWORD: renderflow
          POSTGRES_DB: renderflow_chaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renderflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The harness imports the built @renderflow/* packages, including the child
      # process that gets SIGKILLed.
      - name: build workspace packages
        run: pnpm build

      - name: install postgres client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: chaos scenarios R1-R5
        env:
          CHAOS_DATABASE_URL: postgresql://renderflow:renderflow@localhost:5432/renderflow_chaos
        run: ./tests/chaos/run.sh

  build:
    name: build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: docker/setup-buildx-action@v3

      - name: install
        run: pnpm install --frozen-lockfile

      - name: build all packages
        run: pnpm build

      - name: build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/node-app.Dockerfile
          build-args: |
            APP_DIR=apps/api
            APP_NAME=@renderflow/api
          push: false

      - name: build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false

  e2e:
    name: e2e (compose + Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: docker/setup-buildx-action@v3

      - run: pnpm install --frozen-lockfile

      - name: install Playwright
        run: pnpm --filter @renderflow/tests exec playwright install --with-deps chromium

      # Compose interpolates these into every app container. Generate them here
      # instead of committing fixed test credentials; the values never leave the
      # runner.
      - name: compose env
        run: |
          cat > .env <<EOF
          JWT_ACCESS_SECRET=$(openssl rand -base64 48)
          JWT_REFRESH_SECRET=$(openssl rand -base64 48)
          TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)
          SIGNUP_BONUS_CREDITS=50
          # The journey asserts the progress bar before completion. The mocks are
          # otherwise fast enough to finish before React paints it.
          MOCK_LATENCY_MS=1500
          EOF

      - name: start infra
        run: docker compose up -d postgres redis minio minio-init mailhog

      - name: wait for infra
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U renderflow -d renderflow \
              && docker compose exec -T redis redis-cli ping; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1

      # The seed script imports the built credits package. An empty
      # pricing_rules table makes POST /posts/:id/generate return 500 before the
      # progress UI exists, which looks like a browser bug instead of a missing
      # fresh-install step.
      - name: build workspace packages
        run: pnpm build

      - name: apply migrations
        env:
          DATABASE_URL: postgresql://renderflow:renderflow@localhost:5432/renderflow
        run: pnpm db:migrate

      - name: seed pricing rules
        env:
          DATABASE_URL: postgresql://renderflow:renderflow@localhost:5432/renderflow
        run: pnpm db:seed

      - name: start application
        # The journey generates a caption and schedules it, so the content
        # worker and the relay that routes its stage events are required. A
        # poster/reel journey would also need media-worker.
        run: docker compose up -d api web content-worker outbox-relay

      - name: wait for web
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              exit 0
            fi
            sleep 2
          done
          echo "web did not become ready in 120s" >&2
          exit 1

      - name: Playwright
        run: pnpm test:e2e

      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 | tee compose-e2e.log

      - name: upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            tests/test-results
            compose-e2e.log
          retention-days: 7

      - name: tear down
        if: always()
        run: docker compose down -v
