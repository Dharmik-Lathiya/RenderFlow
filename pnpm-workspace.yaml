# pnpm workspace definition. `packages` lists the workspace globs; every app,
# lib and package directory is picked up automatically.
packages:
  - 'apps/*'
  - 'libs/*'
  - 'packages/*'
  - 'tests'

# Isolated (the pnpm default) means packages only see the deps they declare.
# This is what makes the `libs/* must not import apps/*` rule enforceable.
nodeLinker: isolated

# Never auto-install peers: an unmet peer dep should fail loudly at install
# time instead of being silently patched in.
autoInstallPeers: false

# Fail the install when the local Node version is outside engines.node.
engineStrict: true

# Security pins for transitive dependencies whose parents pin an exact,
# vulnerable version. Each one is a patch/minor upgrade inside the same major
# line, except deepmerge-ts 8, which is only reached by the Prisma CLI that
# drizzle-orm's optional peer drags in and is never imported by RenderFlow.
# Remove an entry once its parent ships the fixed version itself; `pnpm audit`
# in CI is what notices.
overrides:
  body-parser: 2.4.0
  deepmerge-ts: 8.0.2
  handlebars: 4.7.10
  js-yaml: 5.4.1
  multer: 2.5.0
  qs: 6.16.1
  undici: 7.30.1

# pnpm >=10 blocks dependency lifecycle scripts by default. Each entry here has a
# genuine native build step: Prisma extracts its query engines, msgpackr-extract is
# BullMQ's (de)serialiser, argon2 links a native binding, and protobufjs/ssh2 come
# from the Testcontainers drivers used by the integration suite.
allowBuilds:
  prisma: true
  '@prisma/client': true
  '@prisma/engines': true
  msgpackr-extract: true
  # argon2 ships a native binding; cpu-features is its optional accelerator.
  argon2: true
  cpu-features: true
  # Native/transitive deps of testcontainers and its drivers.
  protobufjs: true
  ssh2: true
  # esbuild ships a platform binary; drizzle-kit depends on it.
  esbuild: true
  # @nestjs/swagger's telemetry ping. Opted out explicitly: it phones home on
  # install, and a build tool should not need network access to be installed.
  '@scarf/scarf': false
  # @parcel/watcher's native build is used by the dev file watcher; unrs-resolver
  # links the native resolver used by ESLint. Both are legitimate, local build
  # steps, not network telemetry.
  '@parcel/watcher': true
  unrs-resolver: true
